version: "3.8"
services:
  db:
    image: postgres:13-alpine
    container_name: postgres_dbb
    ports:
      - "5433:5432"
    env_file:
     - ./.env.dev
    restart: always
  parsing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parsing
    ports:
      - "8080:8080"
    env_file:
     - ./.env.dev
    depends_on:
      - db