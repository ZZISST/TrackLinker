basePath: /api/v1
definitions:
  dto.FindMusicReq:
    properties:
      link:
        type: string
    type: object
  dto.MusicResult:
    properties:
      data:
        type: object
    type: object
  model.Album:
    properties:
      artists:
        items:
          $ref: '#/definitions/model.Artist'
        type: array
      cover_image:
        type: string
      genres:
        items:
          $ref: '#/definitions/model.Genre'
        type: array
      id:
        type: string
      music_links:
        items:
          $ref: '#/definitions/model.MusicLink'
        type: array
      record_type:
        type: string
      release_date:
        type: string
      title:
        type: string
      tracks:
        items:
          $ref: '#/definitions/model.Track'
        type: array
      type:
        type: string
    type: object
  model.Artist:
    properties:
      albums:
        items:
          $ref: '#/definitions/model.Album'
        type: array
      avatar:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  model.Genre:
    properties:
      id:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  model.MusicLink:
    properties:
      id:
        type: string
      music_service:
        $ref: '#/definitions/model.MusicService'
      owner_id:
        description: One music link belongs to one track
        type: string
      owner_type:
        type: string
      url:
        type: string
    type: object
  model.MusicService:
    enum:
    - Apple
    - Yandex
    - Spotify
    - Deezer
    - Unsupported
    type: string
    x-enum-varnames:
    - Apple
    - Yandex
    - Spotify
    - Deezer
    - Unsupported
  model.Track:
    properties:
      album:
        $ref: '#/definitions/model.Album'
      album_id:
        description: Foreign key
        type: string
      artists:
        items:
          $ref: '#/definitions/model.Artist'
        type: array
      disc_number:
        type: integer
      duration_sec:
        type: integer
      id:
        type: string
      music_links:
        items:
          $ref: '#/definitions/model.MusicLink'
        type: array
      release_date:
        type: string
      title:
        type: string
      track_number:
        type: integer
      track_preview:
        $ref: '#/definitions/model.TrackPreview'
      type:
        type: string
    type: object
  model.TrackPreview:
    properties:
      file_url:
        type: string
      id:
        type: string
      track_id:
        type: string
    type: object
info:
  contact: {}
  description: Swagger API for GoShop.
  termsOfService: http://swagger.io/terms/
  title: TrackLinker Swagger API
  version: "2.0"
paths:
  /api/v1/album/{album_id}:
    get:
      parameters:
      - description: Album ID
        in: path
        name: album_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Album'
      summary: get album details
      tags:
      - album
  /api/v1/album/{album_id}/track/{track_id}:
    get:
      parameters:
      - description: Album ID
        in: path
        name: album_id
        required: true
        type: string
      - description: Track ID
        in: path
        name: track_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Track'
      summary: get album's track details
      tags:
      - track
  /api/v1/music/search:
    post:
      parameters:
      - description: Body
        in: body
        name: _
        required: true
        schema:
          $ref: '#/definitions/dto.FindMusicReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MusicResult'
      summary: get music
      tags:
      - music
  /api/v1/track/{id}:
    get:
      parameters:
      - description: Track ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Track'
      summary: get track details
      tags:
      - track
swagger: "2.0"
